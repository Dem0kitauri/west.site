services:
  - type: web
    name: nexus-performance
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PAYMENT_URL_START
        sync: false
      - key: PAYMENT_URL_PRO
        sync: false
      - key: PAYMENT_URL_ULTIMATE
        sync: false

databases:
  - name: nexus-postgres
    databaseName: nexus
    user: nexus

